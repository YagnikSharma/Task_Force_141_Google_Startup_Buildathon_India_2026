# Builds an installable NSIN Android APK on GitHub's machines (no Android SDK needed on your PC).
# Run it from GitHub: Actions → "Android APK" → Run workflow, and paste the live.json URL of the
# deployed site (https://<project-id>.web.app/live.json). The APK then finds the Cloud Run API by itself.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      live_config_url:
        description: "Live config URL (https://<project-id>.web.app/live.json)"
        required: true
      release_tag:
        description: "Also attach the APK to a GitHub Release with this tag (leave empty to skip)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        # The debug build type is signed with the standard Android debug key, so it installs on any phone
        # ("install unknown apps" must be allowed). It still uses HTTPS for the live Cloud Run API.
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PnsinLiveConfigUrl="${{ inputs.live_config_url }}"
          mkdir -p ../../out && cp app/build/outputs/apk/debug/*.apk ../../out/NSIN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NSIN-apk
          path: out/NSIN.apk
      - name: Attach to a GitHub Release
        if: ${{ inputs.release_tag != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" --title "NSIN Android ${{ inputs.release_tag }}" \
              --notes "Demo APK. Logins: resident@ / responder@ / admin@neighbourhood.org, password Password123!"
          gh release upload "${{ inputs.release_tag }}" out/NSIN.apk --clobber
