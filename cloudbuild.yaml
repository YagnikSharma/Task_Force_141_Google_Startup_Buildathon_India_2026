# Cloud Build: build the API image, push it to Artifact Registry and deploy it to Cloud Run.
# Run from the repo root (deploy/deploy.sh does this for you):
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-south1,_SQL_INSTANCE=<project:region:instance>
substitutions:
  _REGION: asia-south1
  _SERVICE: nsin-api
  _REPO: nsin
  _SQL_INSTANCE: ""            # project:region:instance of the Cloud SQL for PostgreSQL instance
  _CORS_ORIGINS: ""            # e.g. https://<project>.web.app

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "src/backend/Dockerfile", "-t",
           "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID", "src"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_SQL_INSTANCE}
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=1Gi
      # ^@^ switches the separator to @ so CORS_ORIGINS may contain commas (gcloud topic escaping)
      - --set-env-vars=^@^APP_ENV=production@INSTANCE_CONNECTION_NAME=${_SQL_INSTANCE}@DB_NAME=nsin@DB_USER=nsin@CORS_ORIGINS=${_CORS_ORIGINS}
      - --set-secrets=DB_PASSWORD=nsin-db-password:latest,JWT_SECRET=nsin-jwt-secret:latest,GEMINI_API_KEY=nsin-gemini-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
